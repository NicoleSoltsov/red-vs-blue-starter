name: AI Security Scan
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run the scanner
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
          LLM_MODEL: gemini-3.5-flash-lite
        run: python agent/ci_scan.py > findings.md
      - name: Comment results on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "AI security scan could not complete (it may have hit a rate limit — re-run the job).";
            try { body = fs.readFileSync('findings.md', 'utf8') || body; } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });